name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Catalog page, system pages and downloads from the branch catalog-data (placeholder if it does not exist yet)
        run: |
          if git fetch --depth 1 origin catalog-data; then
            mkdir -p catalog-latest docs/data
            for f in catalog.csv catalog.parquet catalog_meta.json; do git show "FETCH_HEAD:$f" > "catalog-latest/$f"; done
            cp catalog-latest/* docs/data/
            python scripts/system_pages.py catalog-latest
            python scripts/catalog_page.py catalog-latest
          else
            python scripts/catalog_page.py
          fi
      - name: Publish the report JSON Schema at the URL of its $id (DECISIONS.md, D33)
        run: |
          mkdir -p docs/schemas
          version=$(python -c "from exostab.report import SCHEMA_VERSION; print(SCHEMA_VERSION)")
          cp src/exostab/schemas/report.schema.json "docs/schemas/report-$version.json"
      - name: Build the site (fonts downloaded at build time and served from the site)
        run: mkdocs build --strict
        env:
          DOCS_PRODUCTION: "true"  # turns on the privacy plugin (mkdocs.yml)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    # Runs when GitHub Pages uses "Source: GitHub Actions" and the repository variable DEPLOY_DOCS is "true"
    # (both set; RELEASING.md).
    if: vars.DEPLOY_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # Sends the deployed site's URLs to IndexNow after a workflow_dispatch: the weekly catalog (catalog.yml,
    # `gh workflow run`) or "Run workflow". A push sends nothing. With no status function in `if`, this job also needs
    # `deploy` to have succeeded. It is a job of its own because GitHub prepares every action of a job before the job's
    # first step, whatever a step's `if` and continue-on-error say, and because the deploy job holds id-token: write.
    # The sitemap comes from the live site: a copy still cached by the CDN at worst delays a new page to the next run.
    if: github.event_name == 'workflow_dispatch'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # a failed call leaves the run green: the site is already deployed
    steps:
      - uses: actions/checkout@v7
      - name: Send the site's URLs to IndexNow
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output sitemap.xml https://mimitoz62.github.io/exostab/sitemap.xml
          python3 scripts/indexnow.py sitemap.xml

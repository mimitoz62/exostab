name: Weekly catalog

# Recomputes the stability indicators of every multi-planet system in the NASA Exoplanet Archive and publishes
# catalog.csv, catalog.parquet and catalog_meta.json on the branch "catalog-data" (one commit per week, so the
# git history is the version history; dated CSV copies are kept in archive/). A branch is used rather than a
# GitHub release because Zenodo archives every GitHub release, pre-releases included, as a new version of the
# software record. Each system is capped at MAX_SECONDS of wall time; systems over the cap are recorded as
# "timeout" (docs/catalog.md explains the columns). Optionally, a new version of a Zenodo dataset is published
# (see scripts/zenodo_catalog.py).

on:
  schedule:
    - cron: "23 4 * * 1"  # Mondays 04:23 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N systems (0 = all)"
        default: "0"

# The build runs the newest release of every dependency for about two hours, so its job can only read, and keeps no
# token on disk. Each job that writes gets only the permission it needs.
permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

env:
  MAX_SECONDS: "300"
  DRAWS: "10"
  ORBITS: "10000"
  SEED: "0"

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[catalog]"
      - name: Build the catalog
        env:
          MPLBACKEND: Agg
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          # The full log goes to catalog/build.log (uploaded with the catalog); the step keeps the build's exit
          # status, so a failed build stops here instead of at the copy in the job publish.
          mkdir -p catalog
          status=0
          exostab catalog build --refresh --out catalog \
            --orbits "$ORBITS" --draws "$DRAWS" --seed "$SEED" --max-seconds "$MAX_SECONDS" \
            --limit "$LIMIT" > catalog/build.log 2>&1 || status=$?
          tail -n 20 catalog/build.log
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}  # keep build.log when the build fails
        with:
          name: catalog
          path: catalog/

  publish:
    needs: catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push to the catalog-data branch
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: catalog
          path: catalog/
      - name: Publish on the branch catalog-data
        run: |
          day=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin catalog-data >/dev/null; then
            git fetch origin catalog-data
            git worktree add publish origin/catalog-data
            git -C publish switch -c catalog-data
          else
            git worktree add --detach publish
            git -C publish switch --orphan catalog-data
          fi
          mkdir -p publish/archive
          cp catalog/catalog.csv catalog/catalog.parquet catalog/catalog_meta.json publish/
          cp catalog/catalog.csv "publish/archive/catalog-$day.csv"
          cp scripts/catalog_data_license.txt publish/LICENSE
          python scripts/catalog_release_notes.py catalog > publish/README.md
          git -C publish add -A
          git -C publish commit -m "Catalog of $day" || echo "nothing changed"
          git -C publish push origin catalog-data

  zenodo:
    # Only if configured (RELEASING.md).
    if: ${{ vars.ZENODO_CATALOG_RECORD != '' }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - uses: actions/download-artifact@v8
        with:
          name: catalog
          path: catalog/
      - name: Upload a new version to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_CATALOG_RECORD: ${{ vars.ZENODO_CATALOG_RECORD }}
          ZENODO_URL: ${{ vars.ZENODO_URL || 'https://zenodo.org' }}
        run: python scripts/zenodo_catalog.py catalog

  docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write  # start the docs workflow
      contents: read
    steps:
      - name: Rebuild the documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main --repo "$GITHUB_REPOSITORY"

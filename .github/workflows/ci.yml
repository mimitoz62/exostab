name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows-latest / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      EXOSTAB_OFFLINE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest -p no:cacheprovider -rf --tb=short
      - name: CLI smoke test (bash)
        if: always()
        shell: bash
        run: |
          exostab --version
          exostab list --min-planets 4 --max-period-days 200 --offline
          exostab check "TOI-270" --offline --orbits 2000 --draws 3 --out smoke/
          test -f smoke/report.json && test -f smoke/orbits.png && test -f smoke/megno.png
      - name: CLI in PowerShell
        if: always()
        shell: pwsh
        run: |
          exostab check "TRAPPIST-1" --offline --orbits 2000 --draws 3 --out smoke2/
          exostab check "TOI-270" --offline --orbits 2000 --draws 3 --no-plots --out smoke3/ > out.txt
          Get-Content out.txt -Tail 3
